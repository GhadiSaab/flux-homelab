apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sure-postgres
  namespace: sure
spec:
  serviceName: sure-postgres
  replicas: 1
  selector:
    matchLabels:
      app: sure-postgres
  template:
    metadata:
      labels:
        app: sure-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: sure_user
            - name: POSTGRES_DB
              value: sure_production
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sure-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sure_user", "-d", "sure_production"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sure-postgres
  namespace: sure
spec:
  selector:
    app: sure-postgres
  ports:
    - port: 5432
      targetPort: 5432
