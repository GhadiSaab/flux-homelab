# Tailnet-only: finance.gsaab.dev points at the homelab's Tailscale IP
# (same pattern as learnharness), served on websecure (443) alone.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sure
  namespace: sure
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - finance.gsaab.dev
      secretName: sure-tls
  rules:
    - host: finance.gsaab.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sure-web
                port:
                  number: 3000
