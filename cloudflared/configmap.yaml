apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: cc59958f-c05b-4d19-aa70-490693e2e8e6
    credentials-file: /etc/cloudflared/credentials/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: immich.gsaab.dev
        service: http://immich-server.immich.svc.cluster.local:2283
      - hostname: openwebui.gsaab.dev
        service: http://open-webui.open-webui.svc.cluster.local:80
      - hostname: searxng.gsaab.dev
        service: http://searxng.searxng.svc.cluster.local:8080
      - hostname: omni-agent.gsaab.dev
        path: ^/(webhook|healthz)$
        service: http://omni-agent.omni-agent.svc.cluster.local:8080
      - hostname: opencode.gsaab.dev
        service: http://192.168.1.89:3040
      - hostname: freellmapi.gsaab.dev
        service: http://freellmapi.freellmapi.svc.cluster.local:3001
      - hostname: grafana.gsaab.dev
        service: http://kube-prometheus-stack-grafana.monitoring-ns.svc.cluster.local:80
      - hostname: traces.gsaab.dev
        service: http://jaeger.tracing.svc.cluster.local:16686
      - hostname: jellyfin.gsaab.dev
        service: http://jellyfin.jellyfin.svc.cluster.local:8096
      - hostname: gsaab.dev
        service: http://portfolio.portfolio.svc.cluster.local:80
      - hostname: paperclip.gsaab.dev
        service: http://192.168.1.89:8088
        originRequest:
          httpHostHeader: paperclip.gsaab.dev
      - service: http_status:404
