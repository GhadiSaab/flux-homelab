apiVersion: v1
kind: Service
metadata:
  name: adguard
  namespace: adguard
spec:
  # LAN clients reach the pod directly via hostNetwork (192.168.1.89 and the
  # node's IPv6 address); this Service is only for in-cluster access.
  type: ClusterIP
  selector:
    app: adguard
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
