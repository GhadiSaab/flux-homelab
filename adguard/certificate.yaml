apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: adguard-tls
  namespace: adguard
spec:
  # Used for DNS-over-TLS (853) so Android "Automatic" Private DNS picks the
  # homelab instead of skipping to the encrypted public fallback.
  secretName: adguard-tls
  dnsNames:
    - dns.gsaab.dev
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
