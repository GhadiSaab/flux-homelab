apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana-datasource.yaml
  - loki.yaml
  - loki-servicemonitor.yaml
  - alloy.yaml
configMapGenerator:
  - name: alloy-config
    namespace: loki
    files:
      - config.alloy
generatorOptions:
  disableNameSuffixHash: true
