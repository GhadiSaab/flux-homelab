apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "1.10.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    crds:
      create: false
    rbac:
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
      clusterRules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list", "watch"]
    alloy:
      enableReporting: false
      configMap:
        create: false
        name: alloy-config
        key: config.alloy
      storagePath: /var/lib/alloy
      mounts:
        varlog: true
        extra:
          - name: alloy-state
            mountPath: /var/lib/alloy
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    controller:
      type: daemonset
      volumes:
        extra:
          - name: alloy-state
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate
