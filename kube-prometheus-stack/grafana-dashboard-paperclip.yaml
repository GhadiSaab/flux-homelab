apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-paperclip
  namespace: monitoring-ns
  labels:
    grafana_dashboard: "1"
data:
  paperclip-operations.json: |
    {
      "title": "Paperclip · Homelab Operations",
      "uid": "paperclip-operations",
      "schemaVersion": 39,
      "version": 1,
      "timezone": "browser",
      "refresh": "1m",
      "tags": [
        "homelab",
        "paperclip",
        "operations"
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "links": [
        {
          "title": "Paperclip dashboard",
          "url": "https://paperclip.gsaab.dev",
          "targetBlank": true
        }
      ],
      "templating": {
        "list": [
          {
            "name": "prometheus",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Control plane",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "paperclip_up",
              "legendFormat": "Control plane",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 2,
          "title": "PostgreSQL",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "paperclip_database_up",
              "legendFormat": "PostgreSQL",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 3,
          "title": "Backup age",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - paperclip_backup_last_success_timestamp_seconds",
              "legendFormat": "Backup age",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 4,
          "title": "Last restore verification age",
          "type": "stat",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - paperclip_restore_last_verified_timestamp_seconds",
              "legendFormat": "Last restore verification age",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 5,
          "title": "Agents by runtime",
          "type": "barchart",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(adapter)(paperclip_agents)",
              "legendFormat": "{{adapter}}",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 6,
          "title": "Task states",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(status)(paperclip_issues)",
              "legendFormat": "{{status}}",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 7,
          "title": "Runs during the last 24 hours",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "paperclip_runs_24h",
              "legendFormat": "{{status}}",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 8,
          "title": "Agent state",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 11,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${prometheus}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(status)(paperclip_agents)",
              "legendFormat": "{{status}}",
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 9,
          "title": "Recovery and diagnostics",
          "type": "text",
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 24,
            "h": 5
          },
          "options": {
            "mode": "markdown",
            "content": "**Management:** `systemctl --user status paperclipai-homelab` on `gsaab`\n\n**Backups:** encrypted Restic repository; daily 03:15 Europe/Paris. Isolated restore verification every Sunday 04:30.\n\n**Logs:** Explore Loki with `{service_name=\"paperclip\", host=\"gsaab\"}`.\n\n**Traces:** Explore Tempo with `{resource.service.name=\"paperclip-homelab\"}`.\n\nPublic ingress uses the k3s Cloudflare connectors. For cluster recovery, use SSH forwarding to the host-local service."
          }
        }
      ]
    }
