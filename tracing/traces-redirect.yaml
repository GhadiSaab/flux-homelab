apiVersion: v1
kind: ConfigMap
metadata:
  name: traces-redirect
  namespace: tracing
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 302 https://grafana.gsaab.dev/a/grafana-exploretraces-app/explore;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traces-redirect
  namespace: tracing
  labels:
    app.kubernetes.io/name: traces-redirect
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traces-redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traces-redirect
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: traces-redirect
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: traces-redirect
  namespace: tracing
  labels:
    app.kubernetes.io/name: traces-redirect
spec:
  selector:
    app.kubernetes.io/name: traces-redirect
  ports:
    - name: http
      port: 80
      targetPort: http
