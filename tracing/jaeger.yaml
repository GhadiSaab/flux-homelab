apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-query-config
  namespace: tracing
data:
  config.yaml: |
    address: 0.0.0.0:7777
    backend: tempo.tracing.svc.cluster.local:3200
    # Service list is derived from recent blocks; keep it bounded.
    services_query_duration: 1h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: query
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/component: query
    spec:
      containers:
        # Jaeger storage plugin bridge: translates the Jaeger query API into
        # Tempo queries, so the Jaeger UI reads the same traces as Grafana
        # without duplicating storage.
        - name: tempo-query
          image: docker.io/grafana/tempo-query:2.9.5
          args:
            - -config
            - /etc/tempo-query/config.yaml
          ports:
            - name: grpc
              containerPort: 7777
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: config
              mountPath: /etc/tempo-query
              readOnly: true
        - name: jaeger-query
          image: docker.io/jaegertracing/jaeger-query:1.65.0
          env:
            - name: SPAN_STORAGE_TYPE
              value: grpc
            - name: DEPENDENCY_STORAGE_TYPE
              value: grpc
            - name: GRPC_STORAGE_SERVER
              value: 127.0.0.1:7777
            - name: QUERY_BASE_PATH
              value: /
          ports:
            - name: http
              containerPort: 16686
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: tempo-query-config
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: query
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: http
      port: 16686
      targetPort: http
