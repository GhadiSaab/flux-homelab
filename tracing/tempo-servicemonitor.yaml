apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tempo
  namespace: tracing
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - tracing
  selector:
    matchLabels:
      app.kubernetes.io/instance: tempo
      app.kubernetes.io/name: tempo
  endpoints:
    - port: tempo-prom-metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
