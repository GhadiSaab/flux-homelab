apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-traces
  namespace: monitoring-ns
  labels:
    grafana_dashboard: "1"
data:
  traces-requests.json: |
    {
      "title": "Traces (per request)",
      "uid": "traces-requests",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "tracing"
      ],
      "panels": [
        {
          "id": 1,
          "title": "Requests / s by service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service) (rate(traces_spanmetrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",service=~\"$service\"}[$__rate_interval]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error rate by service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service) (rate(traces_spanmetrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\",service=~\"$service\"}[$__rate_interval])) / sum by (service) (rate(traces_spanmetrics_calls_total{span_kind=\"SPAN_KIND_SERVER\",service=~\"$service\"}[$__rate_interval]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "p95 latency by service",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, service) (rate(traces_spanmetrics_latency_bucket{span_kind=\"SPAN_KIND_SERVER\",service=~\"$service\"}[$__rate_interval])))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Recent requests (click a trace ID to see the full span tree + logs)",
          "type": "table",
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "query": "{ resource.service.name =~ \"$service\" && kind = server } with (most_recent = true)",
              "limit": 50,
              "tableType": "traces",
              "filters": []
            }
          ]
        },
        {
          "id": 5,
          "title": "Slow requests (> $min_duration)",
          "type": "table",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "query": "{ resource.service.name =~ \"$service\" && kind = server && duration > $min_duration } with (most_recent = true)",
              "limit": 50,
              "tableType": "traces",
              "filters": []
            }
          ]
        },
        {
          "id": 6,
          "title": "Failed requests (errors / 5xx)",
          "type": "table",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "traceql",
              "query": "{ resource.service.name =~ \"$service\" && kind = server && (status = error || span.http.response.status_code >= 500) } with (most_recent = true)",
              "limit": 50,
              "tableType": "traces",
              "filters": []
            }
          ]
        },
        {
          "id": 7,
          "title": "Service graph",
          "type": "nodeGraph",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 28
          },
          "datasource": {
            "type": "tempo",
            "uid": "tempo"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "tempo",
                "uid": "tempo"
              },
              "queryType": "serviceMap"
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(traces_spanmetrics_calls_total, service)",
              "refId": "s"
            },
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "min_duration",
            "type": "custom",
            "query": "100ms,500ms,1s,5s",
            "current": {
              "text": "500ms",
              "value": "500ms"
            },
            "options": [
              {
                "text": "100ms",
                "value": "100ms",
                "selected": false
              },
              {
                "text": "500ms",
                "value": "500ms",
                "selected": true
              },
              {
                "text": "1s",
                "value": "1s",
                "selected": false
              },
              {
                "text": "5s",
                "value": "5s",
                "selected": false
              }
            ]
          }
        ]
      }
    }
