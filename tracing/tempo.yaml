apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: tracing
spec:
  interval: 1h
  chart:
    spec:
      chart: tempo
      version: "1.24.4"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    tempo:
      reportingEnabled: false
      retention: 72h
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      # Turns spans into RED metrics + a service graph in Prometheus.
      metricsGenerator:
        enabled: true
        remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring-ns:9090/api/v1/write
      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics
    persistence:
      enabled: true
      storageClassName: local-path
      size: 5Gi
