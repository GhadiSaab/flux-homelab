---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 1h
  chart:
    spec:
      chart: open-webui
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  values:
    ollama:
      enabled: false
    pipelines:
      enabled: false
    websocket:
      redis:
        enabled: false
    persistence:
      enabled: true
      size: 5Gi
    service:
      type: ClusterIP
      port: 80
    enableOpenaiApi: true
    openaiBaseApiUrl: "https://qwen36.do-2023.dev/v1"
    openaiApiKeyExistingSecret: openai-api-key
    openaiApiKeyExistingSecretKey: api-key
    commonEnvVars:
      - name: WEBUI_URL
        value: "https://openwebui.gsaab.dev"
      - name: ENABLE_OLLAMA_API
        value: "false"
      - name: ENABLE_RAG_WEB_SEARCH
        value: "true"
      - name: RAG_WEB_SEARCH_ENGINE
        value: "searxng"
      - name: SEARXNG_QUERY_URL
        value: "http://searxng.searxng.svc.cluster.local:8080/search?q=<query>"
      - name: RAG_WEB_SEARCH_RESULT_COUNT
        value: "5"
      - name: RAG_WEB_SEARCH_CONCURRENT_REQUESTS
        value: "5"
      - name: WEBUI_AUTH
        value: "true"
