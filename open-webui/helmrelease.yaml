---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 1h
  chart:
    spec:
      chart: open-webui
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  values:
    ollama:
      enabled: false
    pipelines:
      enabled: false
    websocket:
      manager: ""
      redis:
        enabled: false
    persistence:
      enabled: true
      size: 5Gi
    service:
      type: ClusterIP
      port: 80
    enableOpenaiApi: true
    openaiBaseApiUrls:
      - "https://qwen36.do-2023.dev/v1"
      - "http://freellmapi.freellmapi.svc.cluster.local:3001/v1"
    openaiApiKeysExistingSecret: freellmapi-secret
    openaiApiKeysExistingSecretKey: api-keys
    commonEnvVars:
      - name: WEBUI_URL
        value: "https://openwebui.gsaab.dev"
      - name: ENABLE_WEB_SEARCH
        value: "true"
      - name: WEB_SEARCH_ENGINE
        value: "searxng"
      - name: SEARXNG_QUERY_URL
        value: "http://searxng.searxng.svc.cluster.local:8080/search?q=<query>"
      - name: WEB_SEARCH_RESULT_COUNT
        value: "5"
      - name: WEB_SEARCH_CONCURRENT_REQUESTS
        value: "5"
      - name: WEBUI_AUTH
        value: "true"
      # FreeLLMAPI image generation (Cloudflare-routed, model must be 'auto')
      - name: ENABLE_IMAGE_GENERATION
        value: "true"
      - name: IMAGE_GENERATION_ENGINE
        value: "openai"
      - name: IMAGES_OPENAI_API_BASE_URL
        value: "http://freellmapi.freellmapi.svc.cluster.local:3001/v1"
      - name: IMAGES_OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: freellmapi-secret
            key: api-key
      - name: IMAGE_GENERATION_MODEL
        value: "auto"
      # FreeLLMAPI text-to-speech (model must be 'auto')
      - name: AUDIO_TTS_ENGINE
        value: "openai"
      - name: AUDIO_TTS_OPENAI_API_BASE_URL
        value: "http://freellmapi.freellmapi.svc.cluster.local:3001/v1"
      - name: AUDIO_TTS_OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: freellmapi-secret
            key: api-key
      - name: AUDIO_TTS_MODEL
        value: "auto"
      - name: AUDIO_TTS_VOICE
        value: "alloy"
