apiVersion: apps/v1
kind: Deployment
metadata:
  name: freellmapi
  namespace: freellmapi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: freellmapi
  template:
    metadata:
      labels:
        app: freellmapi
    spec:
      containers:
        - name: freellmapi
          image: ghcr.io/tashfeenahmed/freellmapi:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: freellmapi-env
                  key: encryption-key
          volumeMounts:
            - name: data
              mountPath: /app/server/data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freellmapi-data
