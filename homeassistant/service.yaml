apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  # LAN clients reach the pod directly via hostNetwork (192.168.1.89:8123);
  # this Service is only for in-cluster access.
  type: ClusterIP
  selector:
    app: homeassistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
