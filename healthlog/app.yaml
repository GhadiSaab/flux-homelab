apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthlog
  namespace: healthlog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: healthlog
  template:
    metadata:
      labels:
        app: healthlog
    spec:
      containers:
        - name: healthlog
          image: ghcr.io/mbombeck/healthlog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: APP_URL
              value: https://healthlog.gsaab.dev
            - name: NEXT_PUBLIC_APP_URL
              value: https://healthlog.gsaab.dev
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: TRUST_CF_CONNECTING_IP
              value: "1"
            - name: HEALTHLOG_PROCESS_TYPE
              value: all
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: healthlog-secrets
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: healthlog-secrets
                  key: ENCRYPTION_KEY
            - name: API_TOKEN_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: healthlog-secrets
                  key: API_TOKEN_HMAC_KEY
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 15
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1792Mi
          volumeMounts:
            - name: backups
              mountPath: /var/lib/healthlog/backups
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: healthlog-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: healthlog-backups
  namespace: healthlog
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: healthlog
  namespace: healthlog
spec:
  selector:
    app: healthlog
  ports:
    - port: 3000
      targetPort: 3000
