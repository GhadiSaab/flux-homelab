---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: jellyfin
    namespace: jellyfin
  interval: 1m0s
  values:
    controllers:
      main:
        pod:
          securityContext:
            supplementalGroups:
              - 44
              - 992
        containers:
          main:
            image:
              repository: ghcr.io/linuxserver/jellyfin
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: Etc/UTC
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
            probes:
              # Jellyfin takes 20-60s to come up (DB migrations, library scan).
              # Without a startupProbe, liveness kills it mid-boot.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  failureThreshold: 30
                  periodSeconds: 5
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 3
    service:
      main:
        controller: main
        ports:
          main:
            port: 8096
    persistence:
      config:
        existingClaim: jellyfin-config
        globalMounts:
          - path: /config
      media:
        type: hostPath
        hostPath: /home/ghadi/jellyfin-media
        globalMounts:
          - path: /media
      dri:
        type: hostPath
        hostPath: /dev/dri
        globalMounts:
          - path: /dev/dri
