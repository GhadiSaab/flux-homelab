---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-mcp-server
  namespace: mcp-kubernetes
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kubernetes-mcp-server
    namespace: mcp-kubernetes
  values:
    extraArgs:
      - --read-only
    ingress:
      enabled: false
    rbac:
      create: true
      extraClusterRoleBindings:
        - name: use-view-role
          roleRef:
            name: view
            external: true
