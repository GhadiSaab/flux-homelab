apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-bedrock
  namespace: minecraft
spec:
  interval: 10m
  chart:
    spec:
      chart: minecraft-bedrock
      version: '2.9.0'
      sourceRef:
        kind: HelmRepository
        name: itzg
        namespace: minecraft
  values:
    minecraftServer:
      eula: 'TRUE'
      serverName: 'Homelab Bedrock'
      gameMode: survival
      difficulty: easy
      serverPort: 39132
      serviceType: LoadBalancer
      externalTrafficPolicy: Local
      whitelist: false
    persistence:
      dataDir:
        enabled: true
        Size: 10Gi
    # BDS 1.26+ defaults to the WebRTC 'nethernet' transport (no public UDP
    # port, invisible to Add Server). Force classic RakNet UDP for direct IP joins.
    extraEnv:
      TRANSPORT: raknet
      ALLOW_LIST: "false"
    # Bedrock downloads the server binary on first boot (~60s+),
    # default 30s delays kill it before it starts. Give it room.
    livenessProbe:
      initialDelaySeconds: 120
    readinessProbe:
      initialDelaySeconds: 120
    startupProbe:
      enabled: true
      initialDelaySeconds: 30
      failureThreshold: 60
      periodSeconds: 10
