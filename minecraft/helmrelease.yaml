apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-java
  namespace: minecraft
spec:
  interval: 10m
  chart:
    spec:
      chart: minecraft
      version: 5.2.0
      sourceRef:
        kind: HelmRepository
        name: itzg
        namespace: minecraft
  values:
    minecraftServer:
      eula: TRUE
      type: VANILLA
      version: LATEST
      motd: Homelab Java
      levelName: world
      gameMode: survival
      difficulty: easy
      maxPlayers: 10
      onlineMode: true
      memory: 3G
      serviceType: LoadBalancer
      servicePort: 25565
      externalTrafficPolicy: Local
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 4Gi
    persistence:
      dataDir:
        enabled: true
        Size: 10Gi
    # First boot downloads the server jar and generates the world;
    # default probes kill it before it finishes.
    startupProbe:
      enabled: true
      failureThreshold: 60
      periodSeconds: 10
