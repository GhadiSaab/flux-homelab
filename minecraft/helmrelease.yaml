apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-java
  namespace: minecraft
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: minecraft
      version: '5.2.0'
      sourceRef:
        kind: HelmRepository
        name: itzg
        namespace: minecraft
  values:
    image:
      tag: java21
    minecraftServer:
      eula: 'TRUE'
      type: NEOFORGE
      version: '1.21.8'
      motd: 'Homelab Lucky Block'
      # Fresh world; the old Better MC world stays on the PVC under /data/bmc.
      worldSaveName: luckyblock
      overrideServerProperties: true
      gameMode: survival
      difficulty: easy
      maxPlayers: 10
      onlineMode: true
      memory: 3G
      serviceType: LoadBalancer
      servicePort: 25565
      externalTrafficPolicy: Local
    extraEnv:
      # Wipe the leftover Better MC (Fabric) mods before installing ours.
      REMOVE_OLD_MODS: 'TRUE'
      # Lucky Block (CurseForge 576825, file 7380115) + its required Kotlin for Forge.
      # Clients need the same two mods on NeoForge 1.21.8.
      MODS: >-
        https://edge.forgecdn.net/files/7380/115/lucky-block-neoforge-1.21.6-13.0.jar,
        https://cdn.modrinth.com/data/ordsPcFz/versions/uhJhCT7X/kotlinforforge-5.12.0-all.jar
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 4Gi
    persistence:
      dataDir:
        enabled: true
        Size: 10Gi
    startupProbe:
      enabled: true
      failureThreshold: 60
      periodSeconds: 10
